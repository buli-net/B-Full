plugins { id 'com.android.library' }
android {
    namespace 'androidx.activity'
    compileSdk 37
    defaultConfig { minSdk 14 }
    sourceSets { main { manifest.srcFile 'src/main/AndroidManifest.xml'; java.srcDirs = ['src/main/java']; res.srcDirs = ['src/main/res'] } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies {
    api project(':androidx-core-local')
    api 'androidx.core:core-viewtree:1.0.0'
    api 'androidx.lifecycle:lifecycle-common:2.10.0'
    api 'androidx.lifecycle:lifecycle-runtime:2.10.0'
    api 'androidx.lifecycle:lifecycle-viewmodel:2.10.0'
    api 'androidx.savedstate:savedstate:1.2.1'
    api 'androidx.lifecycle:lifecycle-viewmodel-savedstate:2.10.0'
    api 'androidx.navigationevent:navigationevent:1.0.0'
    implementation 'androidx.profileinstaller:profileinstaller:1.4.0'
    implementation 'androidx.tracing:tracing:1.2.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-core:1.10.2'
}
