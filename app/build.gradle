plugins {
    id 'com.android.application'
}

android {
    buildFeatures { aidl true }
    namespace 'wallet.main'
    compileSdk 37

    defaultConfig {
        applicationId 'wallet.main'
        minSdk 26
        targetSdk 37
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles project.android.getDefaultProguardFile('proguard-android-optimize.txt'),
                    'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}


dependencies {
    // Required by AndroidX Lifecycle, Activity, and NavigationEvent source APIs.
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.11.0'
    // LDAP client compatible with Android; replaces unavailable JNDI APIs in Bouncy Castle.
    implementation 'com.unboundid:unboundid-ldapsdk:7.0.3'
}
