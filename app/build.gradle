plugins {
    id 'com.android.application'
}

android {
    buildFeatures { aidl true }
    namespace 'wallet.main'
    compileSdk 37

    defaultConfig {
        applicationId 'wallet.main'
        minSdk 26
        targetSdk 37
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles project.android.getDefaultProguardFile('proguard-android-optimize.txt'),
                    'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

configurations.configureEach {
    exclude group: 'com.google.errorprone', module: 'error_prone_annotations'
    exclude group: 'com.google.code.findbugs', module: 'annotations'
}

dependencies {
    // AndroidX's upstream monorepo contains multiplatform/generated source sets and cannot be
    // compiled by copying all files into app/src/main/java. Consume the Android AAR artifacts.
    implementation 'androidx.activity:activity:1.13.0'
    implementation 'androidx.core:core:1.19.1'
    implementation 'androidx.appcompat:appcompat:1.8.0'
    implementation 'androidx.recyclerview:recyclerview:1.4.0'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.2.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.11.0'
    // LDAP client compatible with Android; replaces unavailable JNDI APIs in Bouncy Castle.
    implementation 'com.unboundid:unboundid-ldapsdk:7.0.3'
}
