plugins { id 'com.android.library' }
android {
    namespace 'androidx.appcompat'
    compileSdk 37
    defaultConfig { minSdk 14; consumerProguardFiles 'src/main/keepRules/rules.keep' }
    sourceSets { main { manifest.srcFile 'src/main/AndroidManifest.xml'; java.srcDirs = ['src/main/java']; res.srcDirs = ['src/main/res'] } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    androidResources { noCompress += ['ttf'] }
}
dependencies {
    api 'org.jspecify:jspecify:1.0.0'
    api 'androidx.annotation:annotation:1.10.0'
    api project(':androidx-core-local')
    implementation 'androidx.emoji2:emoji2:1.5.0'
    implementation 'androidx.emoji2:emoji2-views-helper:1.2.0'
    implementation 'androidx.collection:collection:1.4.2'
    api 'androidx.cursoradapter:cursoradapter:1.0.0'
    api project(':androidx-activity-local')
    api 'androidx.fragment:fragment:1.5.4'
    api project(':androidx-appcompat-resources-local')
    api 'androidx.drawerlayout:drawerlayout:1.2.0'
    implementation 'androidx.lifecycle:lifecycle-runtime:2.10.0'
    implementation 'androidx.lifecycle:lifecycle-viewmodel:2.10.0'
    implementation 'androidx.profileinstaller:profileinstaller:1.4.0'
    implementation 'androidx.resourceinspection:resourceinspection-annotation:1.0.1'
    annotationProcessor 'androidx.resourceinspection:resourceinspection-processor:1.0.1'
    api 'androidx.savedstate:savedstate:1.2.1'
}
