plugins { id 'com.android.library' }
android {
    namespace 'androidx.appcompat.resources'
    compileSdk 37
    defaultConfig { minSdk 14 }
    sourceSets { main { manifest.srcFile 'src/main/AndroidManifest.xml'; java.srcDirs = ['src/main/java']; res.srcDirs = ['src/main/res'] } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    androidResources { noCompress += ['ttf'] }
}
dependencies {
    api 'org.jspecify:jspecify:1.0.0'
    api 'androidx.annotation:annotation:1.10.0'
    api project(':androidx-core-local')
    implementation 'androidx.collection:collection:1.4.2'
    api 'androidx.vectordrawable:vectordrawable:1.1.0'
    api 'androidx.vectordrawable:vectordrawable-animated:1.1.0'
}
