plugins { id 'com.android.library' }
android {
    namespace 'androidx.swiperefreshlayout'
    compileSdk 37
    defaultConfig { minSdk 14 }
    sourceSets { main { manifest.srcFile 'src/main/AndroidManifest.xml'; java.srcDirs = ['src/main/java']; res.srcDirs = ['src/main/res', 'src/main/res-public'] } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies {
    api 'org.jspecify:jspecify:1.0.0'
    api 'androidx.annotation:annotation:1.10.0'
    api project(':androidx-core-local')
    api 'androidx.interpolator:interpolator:1.0.0'
}
